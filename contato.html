<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contato | Flora Parobé</title><link rel="stylesheet" href="css/style.css"></head><body><div id="header"></div>
<section class="page-hero"><div class="container"><h1 class="section-title" style="font-size:52px">Fale com a Flora Parobé</h1><p style="font-size:20px">Dúvidas, disponibilidade de produtos, pedidos e atendimento.</p></div></section>
<section class="section"><div class="container contact-grid"><div class="contact-card"><h2 class="section-title">Contato</h2><p><strong>WhatsApp:</strong> <span id="phone"></span></p><p><strong>Instagram:</strong> <span id="insta"></span></p><p><strong>Endereço:</strong> <span id="address"></span></p><p><strong>Cidade:</strong> <span id="city"></span></p><a class="btn btn-gold" data-wa>☏ Falar no WhatsApp</a><div class="notice">Atendimento direto pelo WhatsApp para dúvidas, pedidos e disponibilidade de produtos.</div></div><div class="contact-card"><h2 class="section-title">Envie uma mensagem</h2><form id="contactForm"><label>Nome<input id="contactName" required></label><br><label>Telefone<input id="contactPhone"></label><br><label>Mensagem<textarea id="contactMessage" rows="6" required></textarea></label><br><button class="btn btn-gold" type="submit">Enviar pelo WhatsApp</button></form></div></div></section><div id="footer"></div><script src="js/site-config.js"></script><script src="js/site.js"></script><script>document.querySelector('#header').innerHTML=header('contato');document.querySelector('#footer').innerHTML=footer();document.querySelector('#phone').textContent=cfg.business.phoneDisplay;document.querySelector('#insta').textContent=cfg.business.instagram;document.querySelector('#address').textContent=cfg.business.address;document.querySelector('#city').textContent=cfg.business.city;bindCommon();document.querySelector('#contactForm').addEventListener('submit',function(e){e.preventDefault();const nome=document.querySelector('#contactName').value.trim();const telefone=document.querySelector('#contactPhone').value.trim();const mensagem=document.querySelector('#contactMessage').value.trim();const texto=['Olá, Flora Parobé!','',`Nome: ${nome}`,telefone?`Telefone: ${telefone}`:'',`Mensagem: ${mensagem}`].filter(Boolean).join('\n');window.open(`https://wa.me/${cfg.business.phoneDigits}?text=${encodeURIComponent(texto)}`,'_blank');});</script></body></html>
