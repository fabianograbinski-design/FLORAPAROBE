<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flora Parobé | Artigos Religiosos</title><link rel="stylesheet" href="css/style.css"></head><body>
<div id="header"></div><section class="shop-hero shop-hero--image"><div class="container"><img class="hero-banner-img" src="assets/banner-loja.jpg" alt="Loja Flora Parobé - Catálogo completo de artigos religiosos para Umbanda e Candomblé"><h1 class="sr-only">Loja Flora Parobé</h1><p class="sr-only">Catálogo completo de artigos religiosos para Umbanda e Candomblé.</p></div></section>
<section class="promo-month"><div class="container"><a class="promo-month-art-link" href="novidades.html" aria-label="Ver promoção do mês: saias de cetim por R$ 35,00, somente compras pelo site"><img class="promo-month-art" src="assets/promocao-mes-saias-cetim.png" alt="Promoção do mês - Saias de Cetim - R$ 35,00 - somente compras pelo site"></a><div class="promo-buy-wrap"><a class="promo-buy-btn" href="https://wa.me/555199889444?text=Ol%C3%A1!%20Quero%20aproveitar%20a%20Promo%C3%A7%C3%A3o%20do%20M%C3%AAs%20da%20Flora%20Parob%C3%A9%3A%20Saia%20de%20Cetim%20por%20R%24%2035%2C00.%20Compra%20pelo%20site." target="_blank" rel="noopener">🛒 Comprar promoção pelo WhatsApp</a></div></div></section>
<main class="section"><div class="container"><h2 class="section-title">Todos os produtos</h2><p class="section-sub">Pesquise, filtre por categoria e fale conosco pelo WhatsApp.</p><div class="shop-tools"><input id="search" class="searchbox" placeholder="Buscar produto"><div class="chips" id="chips"></div><select id="sort"><option value="id">Mais recentes</option><option value="az">A–Z</option></select></div><div class="products" id="catalog"></div></div></main>
<div id="footer"></div><div class="modal" id="videoModal"><div class="modal-box"><button class="modal-close">×</button><h2 id="videoTitle" class="serif"></h2><div id="videoBody"></div></div></div>
<script src="js/site-config.js"></script><script src="js/site.js"></script><script>
document.querySelector('#header').innerHTML=header('inicio');document.querySelector('#footer').innerHTML=footer();
const cats=['Todos',...new Set(cfg.products.map(p=>p.category))];document.querySelector('#chips').innerHTML=cats.map(c=>`<button class="chip" data-cat="${c}">${c}</button>`).join('');let current=new URLSearchParams(location.search).get('cat')||'Todos';let q='';let sort='id';
function render(){let arr=cfg.products.filter(p=>(current==='Todos'||p.category===current)&&(!q||(`${p.name} ${p.description}`.toLowerCase().includes(q))));if(sort==='az')arr.sort((a,b)=>a.name.localeCompare(b.name));document.querySelector('#catalog').innerHTML=arr.map(productCard).join('');document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.cat===current));bindCommon();}
document.querySelector('#chips').addEventListener('click',e=>{if(e.target.matches('.chip')){current=e.target.dataset.cat;render()}});document.querySelector('#search').addEventListener('input',e=>{q=e.target.value.toLowerCase();render()});document.querySelector('#sort').addEventListener('change',e=>{sort=e.target.value;render()});render();bindCommon();
</script></body></html>
